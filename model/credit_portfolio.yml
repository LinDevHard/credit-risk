# Семантическая модель риск-сводки кредитного портфеля.
# Витрина: один ряд = кредит на дату среза, без списанных, суммы в тенге по курсу на дату среза.
# Доли (PAR30, PAR90, NPL, провизии к портфелю) = отношение sum-мер к portfolio_kzt
# в том же разрезе: par30_share = par30_kzt / portfolio_kzt и т.д.

model: credit_portfolio
source: reporting.v_loan_snapshot

dimensions:
  - name: report_date
    column: report_date
    type: date
    label: Дата среза
  - name: loan_id
    column: loan_id
    type: string
    label: Кредит
  - name: borrower_id
    column: borrower_id
    type: string
    label: Заёмщик
  - name: group_id
    column: group_id
    type: string
    label: Группа связанных заёмщиков
  - name: sector
    column: sector
    type: string
    label: Отрасль
  - name: program
    column: program
    type: string
    label: Программа
  - name: currency
    column: currency
    type: string
    label: Валюта кредита
  - name: dpd_bucket
    column: dpd_bucket
    type: string
    label: Корзина просрочки
  - name: is_restructured
    column: is_restructured
    type: boolean
    label: Реструктуризирован
  - name: is_npl
    column: is_npl
    type: boolean
    label: NPL
  - name: issue_date
    column: issue_date
    type: date
    label: Дата выдачи
  - name: maturity_date
    column: maturity_date
    type: date
    label: Дата погашения

measures:
  - name: portfolio_kzt
    column: principal_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель, ₸
  - name: par30_kzt
    column: par30_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель с просрочкой >30 дней, ₸
  - name: par90_kzt
    column: par90_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель с просрочкой >90 дней, ₸
  - name: npl_kzt
    column: npl_kzt
    type: sum
    format: "#,##0 ₸"
    label: NPL (>90 дней или реструктуризация), ₸
  - name: provisions_kzt
    column: provision_kzt
    type: sum
    format: "#,##0 ₸"
    label: Провизии, ₸
  - name: loan_count
    column: loan_id
    type: count
    format: "#,##0"
    label: Количество кредитов
  - name: avg_loan_kzt
    column: principal_kzt
    type: avg
    format: "#,##0 ₸"
    label: Средний остаток кредита, ₸
  - name: avg_days_past_due
    column: days_past_due
    type: avg
    format: "#,##0.0"
    label: Средняя просрочка, дней
